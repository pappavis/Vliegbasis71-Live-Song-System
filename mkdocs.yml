site_name: Vliegbasis71 Live Song System
site_description: Het receptenboek voor iedere Happy Strummer
site_author: Michiel Erasmus
site_url: https://YOUR-USERNAME.github.io/Vliegbasis71-Live-Song-System/

repo_name: Vliegbasis71 Live Song System
repo_url: https://github.com/YOUR-USERNAME/Vliegbasis71-Live-Song-System
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  language: nl

  logo: assets/logo.svg
  favicon: assets/favicon.svg
  custom_dir: docs/overrides

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: amber
      toggle:
        icon: material/weather-night
        name: Donkere modus

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Lichte modus

  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.path

    - search.highlight
    - search.suggest

    - content.code.copy
    - content.tabs.link

    - toc.follow

plugins:
  - search

markdown_extensions:

  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes

  - pymdownx.details
  - pymdownx.superfences

  - pymdownx.tabbed:
      alternate_style: true

  - pymdownx.highlight:
      anchor_linenums: true

  - pymdownx.inlinehilite

  - pymdownx.keys

  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

nav:

  - 🏠 Home: index.md

  - 📚 Boek:

      - 01 Welkom: 01-Welkom.md
      - 02 Wat heb je nodig: 02-Wat-heb-je-nodig.md
