# ============================================================
# Vliegbasis71 Live Song System
# MkDocs configuration
# ============================================================
#
# Repository:
# https://github.com/pappavis/Vliegbasis71-Live-Song-System
#
# Documentation philosophy:
#
#   GitHub repository
#          │
#          ▼
#      Markdown
#          │
#          ▼
#       MkDocs
#          │
#          ▼
#   GitHub Pages
#
# Collaborative Song Method:
#
#   Human readable
#        +
#   AI readable
#        +
#   Printable
#
# ============================================================


# ------------------------------------------------------------
# SITE
# ------------------------------------------------------------

site_name: Vliegbasis71 Live Song System

site_description: >-
  Het receptenboek voor iedere Happy Strummer.
  Inclusief de Vliegbasis71 Collaborative Song Method:
  een praktische methode voor gezamenlijk woorden, spoken word
  en eenvoudige live liedjes creëren.

site_author: Michiel Erasmus

site_url: https://pappavis.github.io/Vliegbasis71-Live-Song-System/


# ------------------------------------------------------------
# REPOSITORY
# ------------------------------------------------------------

repo_name: pappavis/Vliegbasis71-Live-Song-System

repo_url: https://github.com/pappavis/Vliegbasis71-Live-Song-System

edit_uri: edit/main/docs/


# ------------------------------------------------------------
# DOCUMENT ROOT
# ------------------------------------------------------------

docs_dir: docs


# ------------------------------------------------------------
# THEME
# ------------------------------------------------------------

theme:

  name: material

  language: nl

  logo: assets/logo.svg

  favicon: assets/favicon.svg

  custom_dir: docs/overrides


  # ----------------------------------------------------------
  # LIGHT / DARK MODE
  # ----------------------------------------------------------

  palette:

    - media: "(prefers-color-scheme: light)"

      scheme: default

      primary: green

      accent: amber

      toggle:

        icon: material/weather-night

        name: Donkere modus


    - media: "(prefers-color-scheme: dark)"

      scheme: slate

      primary: green

      accent: amber

      toggle:

        icon: material/weather-sunny

        name: Lichte modus


  # ----------------------------------------------------------
  # MATERIAL FEATURES
  # ----------------------------------------------------------

  features:

    # Fast page navigation
    - navigation.instant

    # Top-level navigation tabs
    - navigation.tabs

    # Group navigation sections
    - navigation.sections

    # Expand nested sections
    - navigation.expand

    # Back-to-top button
    - navigation.top

    # Previous / next navigation
    - navigation.footer

    # Breadcrumb-like navigation path
    - navigation.path

    # Search
    - search.highlight
    - search.suggest

    # Code blocks
    - content.code.copy

    # Tabs
    - content.tabs.link

    # Follow current heading in TOC
    - toc.follow


# ------------------------------------------------------------
# PLUGINS
# ------------------------------------------------------------

plugins:

  - search


# ------------------------------------------------------------
# MARKDOWN EXTENSIONS
# ------------------------------------------------------------

markdown_extensions:

  # Standard Markdown extensions
  - admonition

  - attr_list

  - md_in_html

  - tables

  - footnotes


  # ----------------------------------------------------------
  # PYMDOWN EXTENSIONS
  # ----------------------------------------------------------

  - pymdownx.details

  - pymdownx.superfences

  - pymdownx.tabbed:

      alternate_style: true

  - pymdownx.highlight:

      anchor_linenums: true

  - pymdownx.inlinehilite

  - pymdownx.keys

  - pymdownx.tasklist:

      custom_checkbox: true


# ------------------------------------------------------------
# CUSTOM CSS
# ------------------------------------------------------------

extra_css:

  - stylesheets/extra.css


# ------------------------------------------------------------
# CUSTOM JAVASCRIPT
# ------------------------------------------------------------

extra_javascript:

  - javascripts/extra.js


# ------------------------------------------------------------
# INTENTIONALLY NOT IN NAVIGATION
# ------------------------------------------------------------
#
# definition_of_done-p1.yaml is machine-readable project data,
# rather than a normal documentation page.
#
# MkDocs should know that its omission from nav is intentional.
#
# ------------------------------------------------------------

not_in_nav: |

  collaborative-song/definition_of_done-p1.yaml


# ------------------------------------------------------------
# VALIDATION
# ------------------------------------------------------------
#
# Intended for:
#
#     mkdocs build --strict
#
# Missing documents, forgotten navigation pages and broken links
# should become visible during development.
#
# ------------------------------------------------------------

validation:

  nav:

    omitted_files: warn

    not_found: warn

    absolute_links: warn


  links:

    not_found: warn

    anchors: warn

    absolute_links: warn

    unrecognized_links: warn


